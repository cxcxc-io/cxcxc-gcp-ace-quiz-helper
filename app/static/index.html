<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>考題小幫手</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <h1>考題小幫手</h1>
    <span class="muted">版本 <span id="version">-</span>｜<a href="/admin">管理頁面</a></span>
  </header>

  <!-- 暱稱：只存在瀏覽器（localStorage），不驗證、不註冊 -->
  <section id="nickname-box" class="card">
    <label for="nickname">請輸入暱稱</label><br>
    <input id="nickname" type="text" maxlength="30" placeholder="例如：小明">
    <button id="start">開始答題</button>
  </section>

  <section id="quiz" class="card hidden">
    <p class="muted">暱稱：<span id="who"></span>（<button class="link" id="change-name">更換</button>）｜題號 <span id="qid"></span></p>
    <p id="topic" class="topic hidden"></p>
    <p id="question-cn"></p>
    <p id="question-en" class="muted"></p>
    <p id="multi-hint" class="muted hidden"></p>
    <div id="options"></div>
    <button id="submit">送出答案</button>
    <button id="next" class="hidden">下一題</button>
    <p id="served-by" class="muted hidden"></p>
  </section>

  <section id="result" class="card hidden">
    <p id="result-title"></p>
    <div id="explanation-box" class="hidden"><strong>解析</strong><pre id="explanation"></pre></div>
    <div id="comment-box" class="hidden"><br><strong>講師評語</strong><pre id="comment"></pre></div>
  </section>

  <!-- v2 起：問 AI 為什麼對或錯 -->
  <section id="ai" class="card hidden">
    <button id="ask-ai">問 AI 為什麼</button>
    <label class="muted"><input type="checkbox" id="ungrounded"> 對照實驗：不告訴 AI 正確答案</label>
    <pre id="ai-stream" class="muted hidden"></pre>
    <div id="ai-answer" class="hidden">
      <p><strong>結論</strong>：<span id="ai-conclusion"></span></p>
      <p><strong>關鍵觀念</strong>：<span id="ai-concept"></span></p>
      <ul id="ai-options"></ul>
    </div>
    <p id="ai-error" class="result-bad hidden"></p>
  </section>

  <p id="message" class="muted"></p>
</main>

<script>
const $ = (id) => document.getElementById(id);
let current = null;    // 目前的題目
let shownAt = 0;       // 題目顯示的時間，用來算作答時間

function show(id, visible) { $(id).classList.toggle("hidden", !visible); }

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json();
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

function start() {
  const name = $("nickname").value.trim();
  if (!name) { $("message").textContent = "請先輸入暱稱"; return; }
  localStorage.setItem("nickname", name);
  $("who").textContent = name;
  show("nickname-box", false);
  nextQuestion();
}

async function nextQuestion() {
  $("message").textContent = "";
  show("result", false);
  show("ai", false);
  try {
    current = await api("/api/question");
  } catch (e) {
    $("message").textContent = e.message;
    return;
  }
  $("version").textContent = current.version;

  // v1.1 起：顯示這一題是哪個平台、哪一個執行個體回應的（GKE 是 Pod 名稱）
  $("served-by").textContent = current.instance ? `這一題由 ${current.platform}「${current.instance}」回應` : "";
  show("served-by", !!current.instance);
  $("qid").textContent = current.question_id;
  $("question-cn").textContent = current.question_cn;
  $("question-en").textContent = current.question_en;

  // v1.1 起：顯示題目的主題與相關服務（題庫沒填就不顯示）
  const tags = [];
  if (current.domain) tags.push(`主題：${current.domain}`);
  if (current.services) tags.push(`相關服務：${current.services}`);
  $("topic").textContent = tags.join("｜");
  show("topic", tags.length > 0);

  // 單選題用圓形選項，複選題用方形核取方塊
  const multi = current.answer_count > 1;
  $("multi-hint").textContent = `複選題：請選 ${current.answer_count} 個`;
  show("multi-hint", multi);

  $("options").innerHTML = "";
  for (const o of current.options) {
    const label = document.createElement("label");
    label.className = "option";
    label.dataset.key = o.key;
    const input = document.createElement("input");
    input.type = multi ? "checkbox" : "radio";
    input.name = "choice";
    input.value = o.key;
    const text = document.createElement("div");
    text.innerHTML = `<div>(${o.key}) <span class="en"></span></div><div class="cn"></div>`;
    text.querySelector(".en").textContent = o.en;
    text.querySelector(".cn").textContent = o.cn;
    label.append(input, text);
    $("options").append(label);
  }

  show("quiz", true);
  show("submit", true);
  show("next", false);
  shownAt = Date.now();
}

async function submit() {
  const choice = [...document.querySelectorAll("input[name=choice]:checked")].map((i) => i.value).join("");
  lastChoice = choice;
  if (!choice) { $("message").textContent = "請先選擇答案"; return; }
  $("message").textContent = "";
  $("submit").disabled = true;
  try {
    const r = await api("/api/answer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nickname: localStorage.getItem("nickname"),
        question_id: current.question_id,
        choice: choice,
        elapsed_ms: Date.now() - shownAt,
      }),
    });
    showResult(r);
  } catch (e) {
    $("message").textContent = e.message;
  } finally {
    $("submit").disabled = false;
  }
}

function showResult(r) {
  $("result-title").textContent = r.correct ? "答對了！" : `答錯了，正確答案是 ${r.answer}`;
  $("result-title").className = r.correct ? "result-ok" : "result-bad";
  // 把正確答案的選項標成綠色
  for (const label of document.querySelectorAll(".option")) {
    label.classList.toggle("answer", r.answer.includes(label.dataset.key));
  }
  $("explanation").textContent = r.explanation;
  $("comment").textContent = r.expert_comment;
  show("explanation-box", !!r.explanation);
  show("comment-box", !!r.expert_comment);
  show("result", true);
  resetAi();
  show("ai", true);
  show("submit", false);
  show("next", true);
}

$("start").onclick = start;
$("nickname").onkeydown = (e) => { if (e.key === "Enter") start(); };
$("submit").onclick = submit;
$("next").onclick = nextQuestion;
// ---------- 問 AI（v2 起） ----------
let lastChoice = "";

function resetAi() {
  $("ask-ai").disabled = false;
  for (const id of ["ai-stream", "ai-answer", "ai-error"]) show(id, false);
}

async function askAi() {
  resetAi();
  $("ask-ai").disabled = true;
  $("ai-stream").textContent = "";
  show("ai-stream", true);
  try {
    const res = await fetch("/api/explain", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nickname: localStorage.getItem("nickname"),
        question_id: current.question_id,
        choice: lastChoice,
        grounded: !$("ungrounded").checked,
      }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);

    // 串流：AI 一邊產生，畫面一邊顯示收到的文字
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let text = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      text += decoder.decode(value, { stream: true });
      $("ai-stream").textContent = text;
    }

    // 收完之後，把 JSON（結構化輸出）分欄顯示
    const answer = JSON.parse(text);
    $("ai-conclusion").textContent = answer.conclusion;
    $("ai-concept").textContent = answer.key_concept;
    $("ai-options").innerHTML = "";
    for (const o of answer.options) {
      const li = document.createElement("li");
      li.textContent = `(${o.key}) ${o.note}`;
      $("ai-options").append(li);
    }
    show("ai-stream", false);
    show("ai-answer", true);
  } catch (e) {
    $("ai-error").textContent = e instanceof SyntaxError ? "AI 忙線中，請稍後再試" : e.message;
    show("ai-error", true);
  } finally {
    $("ask-ai").disabled = false;
  }
}

$("ask-ai").onclick = askAi;
$("change-name").onclick = () => { show("quiz", false); show("result", false); show("nickname-box", true); };

// 之前輸入過暱稱就直接開始
const saved = localStorage.getItem("nickname");
if (saved) { $("nickname").value = saved; start(); }
</script>
</body>
</html>
