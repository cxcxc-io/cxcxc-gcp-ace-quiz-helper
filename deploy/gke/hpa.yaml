# HorizontalPodAutoscaler：依 CPU 使用率自動增減 Pod 數量。
# 所有 Pod 的平均 CPU 使用率超過需求的 50% 就增加 Pod，最多 6 個；流量下降後慢慢縮回 2 個。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quiz-helper
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quiz-helper
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
