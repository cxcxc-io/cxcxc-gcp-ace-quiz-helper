# Kubernetes 服務帳戶 quiz-helper
#
# 透過 Workload Identity Federation for GKE，Pod 會以 IAM 服務帳戶
# quiz-helper@<專案 ID>.iam.gserviceaccount.com 的身分存取 Firestore 與 Cloud Storage，
# 和 Lab 1 的 VM 用的是同一個服務帳戶，不需要任何金鑰。
#
# ${PROJECT_ID} 在套用時用 sed 換成你的專案 ID：
#   sed "s|\${PROJECT_ID}|${PROJECT_ID}|g" deploy/gke/serviceaccount.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quiz-helper
  annotations:
    # 這個 Kubernetes 服務帳戶要「扮演」哪一個 IAM 服務帳戶
    iam.gke.io/gcp-service-account: quiz-helper@${PROJECT_ID}.iam.gserviceaccount.com
