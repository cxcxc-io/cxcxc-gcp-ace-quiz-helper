# Kubernetes 服務帳戶 quiz-helper
#
# 小幫手的 Pod 用這個 Kubernetes 服務帳戶執行。透過 Workload Identity Federation for GKE，
# 它在 IAM 裡有對應的主體，Lab 2 步驟 6 會直接把 Firestore 與值區的角色授予它，
# Pod 就能存取 Firestore、Cloud Storage，不需要任何金鑰。
#
# 套用：kubectl apply -f deploy/gke/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quiz-helper
